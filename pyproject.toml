[project]
name = "m4a-rec"
version = "0.1.0"
description = "Two-stage music recommender on Music4All-Onion"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "implicit>=0.7.3",
    "torch>=2.4",
    "faiss-cpu>=1.9",
    "xgboost>=3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["isolated"]  # run in their own process by tests/test_ranker.py
