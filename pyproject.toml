[project]
name = "m4a-rec"
version = "0.1.0"
description = "Two-stage music recommender on Music4All-Onion"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0",
    "pyarrow>=15",
    "numpy>=1.26",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "scipy>=1.11",
    "xgboost>=3.0",
]

[project.optional-dependencies]
# Training needs all three; the service (Phase 7) needs none of them, so its image stays small.
train = ["implicit>=0.7.3", "torch>=2.4", "faiss-cpu>=1.9"]
serve = ["fastapi>=0.115", "uvicorn>=0.30"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
m4a_rec = ["*.html"]  # the demo page's template

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["isolated"]  # run in their own process by tests/test_ranker.py
