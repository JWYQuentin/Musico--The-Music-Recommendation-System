# Phase 5 ranker settings. Every number here is a decision; log changes in reports/decisions.md.

ranker:
  # The two moments the ranker lives in. Everything a snapshot uses comes from its `history`:
  # the listens, the retrieval model (a directory under data/processed/models) and the ALS fit.
  # `als_model` names a directory to save that ALS fit in; the Phase 7 service reads it.
  snapshots:
    train: {history: [retrieval_train], retrieval_model: tt_id, labels: ranker_train}
    infer: {history: [retrieval_train, ranker_train], retrieval_model: tt_id_refit, als_model: als_refit}

  n_recs: 1000        # candidates per user from the retrieval model, and the length of the final list
  recent_days: 28     # "recent" in the features: the last four weeks of the history
  short_days: 7       # "this week" in the features
  select_on: ndcg@10  # the val metric that picks the number of trees and the chosen setting
  seed: 42
  max_rounds: 600     # trees trained per run
  check_every: 25     # the list is scored on val at every multiple of this many trees
  shap_rows: 200000   # candidate rows sampled for the SHAP summary

  # Passed to XGBoost in every run.
  fixed: {tree_method: hist, subsample: 0.8, colsample_bytree: 0.8, min_child_weight: 10}

  # The rankers compared. Each is trained on the feature groups it lists (rank_features.GROUPS).
  models:
    ranker: [models, track, user, pair]                  # Phase 5
    ranker_artist: [models, track, user, pair, artist]   # Phase 6: plus what the user has played by the artist
  final: ranker_artist   # the one the SHAP section, the bias analysis and the demo are about

  # `fit` trains these: for each model, the best LambdaRank setting of the stages below on
  # val. Its stages are run starting from the setting given here.
  chosen:
    ranker:
      n_candidates: 500              # how many of a user's candidates the ranker reorders; the rest keep retrieval order
      max_depth: 3
      eta: 0.1                       # learning rate
      lambdarank_pair_method: mean   # which pairs the ranking loss compares; not tuned, topk is unstable here (see decisions.md)
      objective: "rank:ndcg"         # LambdaRank; binary:logistic is the plain yes/no alternative
    # Its stages were run starting from the `ranker` setting above.
    ranker_artist: {n_candidates: 500, max_depth: 2, eta: 0.05, lambdarank_pair_method: mean, objective: "rank:ndcg"}

  # `ranker pools <model>` scores the chosen setting on val with each of these in place of the
  # first n_candidates: a user's first `top` candidates, then up to `known_artist` of their
  # next ones by an artist they have played. The first is the pool the others are compared with.
  pools:
    - {top: 500, known_artist: 0}      # the pool the saved rankers use
    - {top: 400, known_artist: 100}    # the same size, a fifth of it from known artists
    - {top: 300, known_artist: 1000}   # every known-artist candidate below the first 300
    - {top: 500, known_artist: 200}    # a larger pool
    - {top: 1000, known_artist: 0}     # every candidate: wider without choosing by artist

  # Tuned on val in stages. Each stage tries its combinations on top of the best setting so far.
  stages:
    - {max_depth: [1, 2, 3, 4, 6, 8], eta: [0.1, 0.2]}
    - {eta: [0.05, 0.1]}             # 0.1 beat 0.2 at every depth, so one step lower at the best depth
    - {n_candidates: [200, 500, 1000]}
    - {objective: ["rank:ndcg", "binary:logistic"]}
